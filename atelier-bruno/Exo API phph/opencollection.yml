opencollection: 1.0.0

info:
  name: Exo API phph
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  auth:
    type: bearer
    token: demo-token
  variables:
    - name: baseUrl
      value: http://localhost:4010
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
